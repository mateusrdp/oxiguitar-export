[package]
name = "oxiguitar-export-plugin"
description = "The OxiGuitar audio export plugin: File → Export Audio…, the score's sound as a WAV, FLAC, MP3 or Opus file, each format with its own choices in the export dialog."
version = "0.1.2"
edition = "2024"
# Rust from rustup, raised only when something needs it (CONTRIBUTING.md).
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Mateus Rocha de Paula", "The OxiGuitar contributors"]
repository = "https://github.com/mateusrdp/oxiguitar-export"
homepage = "https://github.com/mateusrdp/oxiguitar-export"
publish = false

[lib]
# An ordinary library for tests, and export.oxp when built with
# `--features oxp --crate-type cdylib` (build-oxp.sh).
crate-type = ["lib"]

[features]
oxp = []

[dependencies]
# The SDK, from OxiGuitar's repository at the tag of the release this is
# built for (0.21.2: interface 1.11, an export's options in the export
# dialog). Nothing of OxiGuitar's is on crates.io.
oxiguitar-plugin = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.21.2" }

# The encoders, all pure Rust, used as published (CREDITS in README.md).
# FLAC: streams frame by frame, STREAMINFO written over at the end.
rusty_flac = "0.5.1"
# MP3: streams frame by frame, the gapless Info/Xing frame written over the
# first one at the end.
rusty_mp3 = "1.0.6"
# Opus in Ogg (RFC 7845): streams packet by packet, pages included.
opus-pure = "0.2.3"

# Plugins deny `unsafe` rather than forbid it: `export_plugin!` allows it on
# the two attributes it generates, and nowhere else.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[dev-dependencies]
# The contract suite (tests/contract.rs) builds the .oxp file and checks it
# through OxiGuitar's own plugin host.
oxiguitar-plugin-test = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.21.2" }

[profile.release]
# Small files. Keep the default `panic = "unwind"`: a panic is then caught
# and reported as an error instead of closing OxiGuitar.
lto = "thin"
codegen-units = 1
strip = "symbols"

# Its own workspace, wherever the folder is copied.
[workspace]
